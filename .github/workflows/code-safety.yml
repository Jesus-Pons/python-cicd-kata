name: Code Checker
run-name: Running Code Checker for ${{ github.ref }} on ${{ github.event_name }}

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-uv
      - run: uv run ruff check .
      - uses: ./.github/actions/minimize-uv-cache

  check-formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-uv
      - run: uv run ruff format --check .
      - uses: ./.github/actions/minimize-uv-cache

  check-type-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-uv
      - run: uv run pyright
      - uses: ./.github/actions/minimize-uv-cache

  run-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-uv
      - run: uv run pytest
      - uses: ./.github/actions/minimize-uv-cache